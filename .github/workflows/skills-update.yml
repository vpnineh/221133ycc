name: Skills drift check

# Skills are not vendored — every session installs them fresh from upstream, so
# the skills themselves never go stale. This catches what does: the claude-seo
# version pin, upstreams that retired into redirect stubs, new name collisions
# between bundles, and SKILLS.md drifting from what actually installs.
#
# Runs daily, opens one PR when something changed, and does nothing otherwise.
#
# Step order is load-bearing:
#   - the pin is bumped BEFORE claude-seo installs, so a PR proposing a new
#     version has actually installed that version
#   - drift is checked BEFORE SKILLS.md is regenerated; afterwards the check
#     compares the file against itself and can only ever say "no drift"

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skills-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # SKILLS_STRICT makes a bundle that fails to install fail the job. A live
      # session tolerates that and starts with what it has; this job must not,
      # or it goes on to propose an inventory with those skills deleted.
      - name: Install the skill bundles
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          SKILLS_STRICT: '1'
        run: bash .claude/scripts/setup-skills.sh

      - name: Bump the claude-seo pin if upstream released
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(grep -oP 'REPO_TAG="\$\{CLAUDE_SEO_TAG:-\K[^}]+' .claude/scripts/setup-claude-seo.sh)
          latest=$(curl -fsSL --max-time 30 -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/AgriciDaniel/claude-seo/releases/latest \
            | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ -n "${latest}" ] && [ "${latest}" != "${current}" ]; then
            sed -i "s|CLAUDE_SEO_TAG:-${current}|CLAUDE_SEO_TAG:-${latest}|" \
              .claude/scripts/setup-claude-seo.sh
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "claude-seo ${current} -> ${latest}"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "claude-seo ${current} is current"
          fi

      # Installs whatever the pin now says. No continue-on-error: if a newly
      # bumped version does not install, the job fails instead of proposing it.
      # The Chromium wiring is skipped here — runners have no pre-installed
      # browser — so this proves the install, not the wiring.
      - name: Install claude-seo at the (possibly bumped) pin
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: bash .claude/scripts/setup-claude-seo.sh

      - name: Check for drift against the committed inventory
        id: drift
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e -o pipefail
          bash .claude/scripts/check-skill-drift.sh | tee drift-report.txt
          echo "issues=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e +o pipefail
          {
            echo '## Skills drift'
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the inventory
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: bash .claude/scripts/list-skills.sh

      # Last line of defence. A healthy day moves a handful of skills; a large
      # drop means installs broke, not that upstream deleted half its skills.
      # Refuse to propose it.
      - name: Refuse an inventory that collapsed
        run: |
          count() { sed '/^## Account level/,$d' "$1" | grep -c '^- \*\*' || true; }
          git show HEAD:.claude/SKILLS.md > /tmp/committed.md
          before=$(count /tmp/committed.md)
          after=$(count .claude/SKILLS.md)
          echo "skills: committed=${before} now=${after}"
          if [ "${before}" -gt 0 ] && [ $(( after * 100 / before )) -lt 90 ]; then
            echo "::error::Inventory fell from ${before} to ${after} skills (>10% drop)." \
                 "That is an install failure, not upstream drift. Not opening a PR."
            exit 1
          fi

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN_BUMPED: ${{ steps.pin.outputs.bumped }}
          PIN_FROM: ${{ steps.pin.outputs.current }}
          PIN_TO: ${{ steps.pin.outputs.latest }}
        run: |
          git add -A .claude
          if git diff --cached --quiet; then
            echo "Nothing changed; no PR."
            exit 0
          fi

          branch="skills/auto-update-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"

          title="Skills: daily update"
          [ "${PIN_BUMPED}" = "true" ] && title="Skills: claude-seo ${PIN_FROM} -> ${PIN_TO}"

          {
            echo "Opened by the daily \`skills-update\` workflow."
            echo
            if [ "${PIN_BUMPED}" = "true" ]; then
              echo "Bumped the claude-seo pin from \`${PIN_FROM}\` to \`${PIN_TO}\`."
              echo "CI installed \`${PIN_TO}\` successfully, but runners have no"
              echo "pre-installed browser, so the Chromium wiring was not exercised."
              echo "After merging, confirm \`claude-seo doctor\` reports"
              echo "\`Chromium: ready\` in the next web session."
              echo
            fi
            echo "Drift report from this run, against the committed inventory:"
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
            echo
            echo "Review the SKILLS.md diff before merging — a skill disappearing"
            echo "from it usually means an upstream renamed or retired something."
          } > pr-body.md

          git commit -q -m "${title}" \
            -m "Automated by .github/workflows/skills-update.yml. See the PR body for this run's drift report."
          # --force: a same-day re-run reuses the branch name, and this job owns it.
          git push -q --force -u origin "${branch}"
          gh pr create --head "${branch}" --title "${title}" --body-file pr-body.md \
            || gh pr edit "${branch}" --title "${title}" --body-file pr-body.md
